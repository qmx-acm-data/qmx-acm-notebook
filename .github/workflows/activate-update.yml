name: Prepare published update channel
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag (for example v0.6.1)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: update-channel
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require a published stable release from main history
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Stable version tag required'; exit 1; }
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const r=JSON.parse(s);if(r.isDraft||r.isPrerelease)process.exit(1)})"
          gh auth setup-git --hostname github.com
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" main
          git merge-base --is-ancestor "$RELEASE_TAG^{commit}" origin/main
      - name: Download release feed, never the private key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming/feed incoming/resources
          gh release download "$RELEASE_TAG" --pattern update-manifest.json --pattern update-app.asar --dir incoming
          mv incoming/update-manifest.json incoming/feed/manifest.json
          mv incoming/update-app.asar incoming/resources/app.asar
          gh release view "$RELEASE_TAG" --json assets > incoming/release-assets.json
          # Missing metadata denotes a legacy release. Download errors for an
          # advertised delta manifest must fail instead of silently dropping it.
          if node -e "const r=require('./incoming/release-assets.json');process.exit(r.assets.some(a=>a.name==='delta-manifest.json')?0:1)"; then
            gh release download "$RELEASE_TAG" --pattern delta-manifest.json --dir incoming
            mv incoming/delta-manifest.json incoming/feed/delta.json
            node tools/delta-feed.cjs list-assets incoming --version "${RELEASE_TAG#v}" > incoming/delta-assets.txt
            mkdir -p incoming/resources/deltas
            while IFS= read -r ASSET; do
              gh release download "$RELEASE_TAG" --pattern "$ASSET" --dir incoming
              HASH=${ASSET#update-delta-}
              HASH=${HASH%.qmxdelta}
              mv "incoming/$ASSET" "incoming/resources/deltas/$HASH.qmxdelta"
            done < incoming/delta-assets.txt
          fi
      - name: Verify signature, version and content before preparing channel
        shell: bash
        run: |
          set -euo pipefail
          node tools/release-feed.cjs verify incoming --version "${RELEASE_TAG#v}" --runtime-version manifest
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('incoming/feed/manifest.json'));if('v'+m.version!==process.env.RELEASE_TAG)throw Error('Release version mismatch');const old=JSON.parse(fs.readFileSync('feed/manifest.json'));const parts=v=>v.split('.').map(Number);const a=parts(m.version),b=parts(old.version);const cmp=a.reduce((r,x,i)=>r||(x>b[i]?1:x<b[i]?-1:0),0);if(cmp<=0)throw Error('Channel already has this or a newer version; refusing downgrade or replacement');"
      - name: Create review branch without modifying main
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="update-channel/$RELEASE_TAG"
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo 'Channel review branch already exists; inspect it instead of overwriting'; exit 1
          fi
          git switch -c "$BRANCH"
          node tools/delta-feed.cjs install incoming --root-dir . --version "${RELEASE_TAG#v}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed/manifest.json resources/app.asar
          # Include new metadata/patches and tracked deletions without broad staging.
          if [[ -e feed/delta.json ]] || git ls-files --error-unmatch feed/delta.json >/dev/null 2>&1; then
            git add -- feed/delta.json
          fi
          if [[ -d resources/deltas ]] || [[ -n "$(git ls-files -- resources/deltas)" ]]; then
            git add -A -- resources/deltas
          fi
          git commit -m "Activate signed update $RELEASE_TAG after release acceptance"
          gh auth setup-git --hostname github.com
          git push origin "HEAD:refs/heads/$BRANCH"
          printf '## Update channel requires review\n\nPublished installers do not change the client update feed until this branch is merged.\n\nOpen/merge the channel PR: https://github.com/%s/compare/main...%s\n' "$GH_REPO" "$BRANCH" >> "$GITHUB_STEP_SUMMARY"
          if ! gh pr create --base main --head "$BRANCH" --title "Activate signed update $RELEASE_TAG" --body "Published release $RELEASE_TAG has passed signature, version and SHA-256 verification. Merge after acceptance to notify existing clients. This activates the signed application feed and optional signed delta metadata/patches; only superseded patches owned by the previous signed feed are removed."; then
            echo '::warning::Repository policy may forbid Actions-created pull requests. The review branch was pushed successfully; use the compare link above to open the PR manually.'
          fi
      - name: Run required source checks for the channel branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="update-channel/$RELEASE_TAG"
          HEAD_SHA=$(git rev-parse HEAD)
          # Bot pushes/PRs do not trigger ordinary CI; workflow_dispatch is explicit.
          gh workflow run ci.yml --ref "$BRANCH"
          RUN_ID=''
          for ATTEMPT in {1..12}; do
            RUN_ID=$(gh run list --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$HEAD_SHA\") | .databaseId" | head -n 1)
            [[ -n "$RUN_ID" ]] && break
            sleep 5
          done
          [[ -n "$RUN_ID" ]] || { echo 'Unable to locate source-check run; dispatch Source checks on the channel branch manually'; exit 1; }
          printf '\nSource checks: https://github.com/%s/actions/runs/%s\n' "$GH_REPO" "$RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          gh run watch "$RUN_ID" --exit-status --interval 10
